name: Publish agent-runner

# TA (or Eric) triggers: gh workflow run publish-runner.yml
# Image push uses GITHUB_TOKEN (packages:write). Caller PAT needs Actions write only.

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default latest)"
        required: false
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${{ inputs.tag }}"
          echo "name=ghcr.io/${owner}/cursor-agent-runner:${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}
          provenance: false
