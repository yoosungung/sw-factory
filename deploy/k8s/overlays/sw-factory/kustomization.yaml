# Soft factory staff stack — namespace sw-factory.
# Do not set top-level `namespace:` here: agent-rbac has Roles in sw-factory + nl2sql
# (+ path-graph); a global namespace rewrite collapses them into one ID.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: patch-flush.yaml
  - path: patch-tick.yaml
  - path: patch-pvc.yaml
  - path: patch-spend.yaml
