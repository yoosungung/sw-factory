apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - agent-rbac.yaml
  - cronjob-flush-retries.yaml
  - cronjob-schedule-tick.yaml
  # candydate: local-only deploy/k8s/base/cronjob-candydate.yaml (gitignore); install-sw-factory.sh applies if present
  - cronjob-pvc-retention.yaml
  - cronjob-spend-alert.yaml
  - generated/

configMapGenerator:
  - name: cursorbridge-ops-scripts
    files:
      - ops-scripts/pvc_chat_retention.py
      - ops-scripts/spend_alert.py
    options:
      disableNameSuffixHash: true

