apiVersion: v1
kind: ServiceAccount
metadata:
  name: cursor-agent
  namespace: sw-factory
  labels:
    app: cursor-agent
---
# TA-only operator SA (cluster mutate + test-NS write). Other bots use cursor-agent (read-only).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cursor-agent-ta
  namespace: sw-factory
  labels:
    app: cursor-agent
    agent: ta
---
# Read-only cluster discovery for pm/km/qa/aa/dev runners.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cursor-agent-observer
  labels:
    app: cursor-agent
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - events
      - namespaces
      - nodes
      - persistentvolumes
      - persistentvolumeclaims
      - configmaps
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/stats", "nodes/metrics"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cursor-agent-observer
  labels:
    app: cursor-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cursor-agent-observer
subjects:
  - kind: ServiceAccount
    name: cursor-agent
    namespace: sw-factory
---
# TA operator: monitoring + limited remediation. No Role/ClusterRole/Binding write.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cursor-agent-ta-operator
  labels:
    app: cursor-agent
    agent: ta
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - events
      - namespaces
      - nodes
      - persistentvolumes
      - persistentvolumeclaims
      - configmaps
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "persistentvolumes", "nodes"]
    verbs: ["patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/stats", "nodes/metrics"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cursor-agent-ta-operator
  labels:
    app: cursor-agent
    agent: ta
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cursor-agent-ta-operator
subjects:
  - kind: ServiceAccount
    name: cursor-agent-ta
    namespace: sw-factory
---
# Test NS write: TA Deploying Test full stack. RBAC object write denied.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cursor-agent-test-ns-write
  namespace: sw-factory
  labels:
    app: cursor-agent
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cursor-agent-test-ns-write
  namespace: sw-factory
  labels:
    app: cursor-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cursor-agent-test-ns-write
subjects:
  - kind: ServiceAccount
    name: cursor-agent-ta
    namespace: sw-factory
---
# Additional tenant test-NS Role/RoleBinding copies belong in a local overlay
# (real tenant NS names are not committed). Factory NS write is above.
# path-graph Argo: bound to ta SA for now (path agent not in soft-factory staff).
# Reintroduce path-dedicated SA when path bot returns.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cursor-agent-argo-workflows
  namespace: path-graph
  labels:
    app: cursor-agent
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get", "list", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cursor-agent-argo-workflows
  namespace: path-graph
  labels:
    app: cursor-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cursor-agent-argo-workflows
subjects:
  - kind: ServiceAccount
    name: cursor-agent-ta
    namespace: sw-factory
