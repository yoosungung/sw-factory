# Example only — do not apply with real secrets committed.
# Prefer:
#   kubectl -n sw-factory create secret generic sw-factory-agent \
#     --from-literal=GATEWAY_SESSION_COOKIE='lt_session=…' \
#     --from-literal=CURSOR_API_KEY='…' \
#     --from-literal=GH_TOKEN='ghp_…' \
#     --from-literal=PERSONA_PASSWORD='…'
apiVersion: v1
kind: Secret
metadata:
  name: sw-factory-agent
  namespace: sw-factory
  labels:
    app: sw-factory-agent
type: Opaque
stringData:
  GATEWAY_SESSION_COOKIE: "lt_session=REPLACE_ME"
  CURSOR_API_KEY: ""
  # HTTPS clone for agents.yaml repos[] (entrypoint ensure-repos-cli)
  GH_TOKEN: ""
  # Pod startup login + optional seed Job. Same bot password as register.
  PERSONA_PASSWORD: ""
